# =============================================================================
#  line_config.yaml  -  STRUCTURE of the reconfigurable assembly line
# -----------------------------------------------------------------------------
#  Objects (what exists) + relationships (how they are connected).
#  There are NO times, distributions or measurements in this file - those
#  belong to line_data.yaml. A reconfiguration = editing the relationships
#  below. The simulator, the sensor pipeline and the dashboard all read this
#  same description, so nothing has to be rewritten by hand when the line
#  changes.
#
#  ID convention (physical hardware keeps its ID forever):
#     station n, slot k  ->  bin B<n><k>, load cell LC_<n><k>, camera CAM_S<n>
#     e.g. LC_35 measures bin B35 (Station 3, slot 5), which contains C10.
#     If B35 is later filled with C21, only the "contains" relationship
#     changes - the sensor is still LC_35.
# =============================================================================

line:
  name: VIPER / Innovation Factory manual assembly line
  version: baseline
  description: >-
    Six-station manual line. One operator, five component bins (each on its
    own load cell) and one camera per station. Buffers between neighbouring
    stations.
  bins_per_station: 5

# Product flow, left to right. Write parallel stations as a list, e.g. [S3, S3B]
routing: [S1, S2, S3, S4, S5, S6]

# Buffers between neighbouring stages. No buffer = direct hand-off (capacity 0).
buffers:
  BUF1: {from: S1, to: S2, capacity: 1}
  BUF2: {from: S2, to: S3, capacity: 2}
  BUF3: {from: S3, to: S4, capacity: 2}
  BUF4: {from: S4, to: S5, capacity: 1}
  BUF5: {from: S5, to: S6, capacity: 1}

# Station -> operator, camera and the ORDERED list of processes performed there.
stations:
  S1: {name: "Station 1", operator: O1, camera: CAM_S1, processes: [P1]}
  S2: {name: "Station 2", operator: O2, camera: CAM_S2, processes: [P2]}
  S3: {name: "Station 3", operator: O3, camera: CAM_S3, processes: [P3, P4]}
  S4: {name: "Station 4", operator: O4, camera: CAM_S4, processes: [P5]}
  S5: {name: "Station 5", operator: O5, camera: CAM_S5, processes: [P6]}
  S6: {name: "Station 6", operator: O6, camera: CAM_S6, processes: [P7]}

operators:
  O1: {name: "Operator 1"}
  O2: {name: "Operator 2"}
  O3: {name: "Operator 3"}
  O4: {name: "Operator 4"}
  O5: {name: "Operator 5"}
  O6: {name: "Operator 6"}

# Assembly transformations: inputs consumed (quantity per unit) -> output produced.
# Inputs are picked from bins in the order written here.
processes:
  P1: {name: "Base & frame prep",       inputs: {C01: 1, C02: 2, C03: 4},                output: SA1}
  P2: {name: "Side panels & fastening", inputs: {SA1: 1, C04: 2, C05: 6, C06: 2},        output: SA2}
  P3: {name: "Bearing & shim install",  inputs: {SA2: 1, C10: 1, C09: 2},                output: SA3}
  P4: {name: "Motor mount & alignment", inputs: {SA3: 1, C07: 1, C08: 1},                output: SA4}
  P5: {name: "Electronics & wiring",    inputs: {SA4: 1, C11: 1, C12: 1, C13: 2},        output: SA5}
  P6: {name: "Cover, inspect & pack",   inputs: {SA5: 1, C14: 1, C15: 4, C16: 1, C17: 2}, output: SA6}
  P7: {name: "Label & palletize",       inputs: {SA6: 1, C18: 1, C19: 2},                output: FG}

components:
  C01: {name: "Base plate"}
  C02: {name: "Frame bracket"}
  C03: {name: "M4 screw"}
  C04: {name: "Side panel"}
  C05: {name: "M3 screw"}
  C06: {name: "Spacer"}
  C07: {name: "Motor"}
  C08: {name: "Shaft coupler"}
  C09: {name: "Alignment shim"}
  C10: {name: "Bearing"}
  C11: {name: "Control PCB"}
  C12: {name: "Cable harness"}
  C13: {name: "Cable tie"}
  C14: {name: "Top cover"}
  C15: {name: "Rubber foot"}
  C16: {name: "Product box"}
  C17: {name: "Foam insert"}
  C18: {name: "Shipping label set"}
  C19: {name: "Strap clip"}
  C20: {name: "Grease sachet"}                  # spare - not used by any process
  C21: {name: "Bearing (alternate supplier)"}   # spare - see variants/alt_bearing_C21.yaml
  C22: {name: "Locating pin"}                   # spare

subassemblies:
  SA1: {name: "Framed base"}
  SA2: {name: "Paneled frame"}
  SA3: {name: "Frame with bearing"}
  SA4: {name: "Motorized frame"}
  SA5: {name: "Wired unit"}
  SA6: {name: "Packed unit"}

products:
  FG: {name: "Finished unit"}

# Bin -> station and bin -> component. component: null = empty/spare slot.
bins:
  B11: {station: S1, component: C01}
  B12: {station: S1, component: C02}
  B13: {station: S1, component: C03}
  B14: {station: S1, component: null}
  B15: {station: S1, component: null}
  B21: {station: S2, component: C04}
  B22: {station: S2, component: C05}
  B23: {station: S2, component: C06}
  B24: {station: S2, component: null}
  B25: {station: S2, component: null}
  B31: {station: S3, component: C07}
  B32: {station: S3, component: C08}
  B33: {station: S3, component: C09}
  B34: {station: S3, component: null}
  B35: {station: S3, component: C10}
  B41: {station: S4, component: C11}
  B42: {station: S4, component: C12}
  B43: {station: S4, component: C13}
  B44: {station: S4, component: null}
  B45: {station: S4, component: null}
  B51: {station: S5, component: C14}
  B52: {station: S5, component: C15}
  B53: {station: S5, component: C16}
  B54: {station: S5, component: C17}
  B55: {station: S5, component: null}
  B61: {station: S6, component: C18}
  B62: {station: S6, component: C19}
  B63: {station: S6, component: null}
  B64: {station: S6, component: null}
  B65: {station: S6, component: null}

# Sensors keep a stable ID. Load cell -> bin it measures; camera -> station it observes.
sensors:
  LC_11: {type: load_cell, measures: B11}
  LC_12: {type: load_cell, measures: B12}
  LC_13: {type: load_cell, measures: B13}
  LC_14: {type: load_cell, measures: B14}
  LC_15: {type: load_cell, measures: B15}
  LC_21: {type: load_cell, measures: B21}
  LC_22: {type: load_cell, measures: B22}
  LC_23: {type: load_cell, measures: B23}
  LC_24: {type: load_cell, measures: B24}
  LC_25: {type: load_cell, measures: B25}
  LC_31: {type: load_cell, measures: B31}
  LC_32: {type: load_cell, measures: B32}
  LC_33: {type: load_cell, measures: B33}
  LC_34: {type: load_cell, measures: B34}
  LC_35: {type: load_cell, measures: B35}
  LC_41: {type: load_cell, measures: B41}
  LC_42: {type: load_cell, measures: B42}
  LC_43: {type: load_cell, measures: B43}
  LC_44: {type: load_cell, measures: B44}
  LC_45: {type: load_cell, measures: B45}
  LC_51: {type: load_cell, measures: B51}
  LC_52: {type: load_cell, measures: B52}
  LC_53: {type: load_cell, measures: B53}
  LC_54: {type: load_cell, measures: B54}
  LC_55: {type: load_cell, measures: B55}
  LC_61: {type: load_cell, measures: B61}
  LC_62: {type: load_cell, measures: B62}
  LC_63: {type: load_cell, measures: B63}
  LC_64: {type: load_cell, measures: B64}
  LC_65: {type: load_cell, measures: B65}
  CAM_S1: {type: camera, station: S1}
  CAM_S2: {type: camera, station: S2}
  CAM_S3: {type: camera, station: S3}
  CAM_S4: {type: camera, station: S4}
  CAM_S5: {type: camera, station: S5}
  CAM_S6: {type: camera, station: S6}
